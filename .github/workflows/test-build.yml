name: Test & Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Minimal permissions required for checkout and build
permissions:
  contents: read

jobs:
  test-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
